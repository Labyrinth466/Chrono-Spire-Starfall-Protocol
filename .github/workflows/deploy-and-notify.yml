name: Deploy Web Game & Notify Discord

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install dependencies
        run: npm install

      - name: 🏗️ Build Vite project
        run: npm run build

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: 📢 Send Build Notification to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_BUILD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "Discord Webhook not set, skipping notification."
            exit 0
          fi

          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            COLOR=5763719 # Green
            TITLE="🚀 New Game Build Available!"
            DESC="ตัวเกมเวอร์ชันล่าสุดถูกอัปเดตเรียบร้อยแล้ว!\nสามารถคลิกปุ่มลิงก์ด้านล่างเพื่อเปิดทดลองเล่นได้ทันที"
          else
            COLOR=15548997 # Red
            TITLE="❌ Game Build Failed"
            DESC="การ Build ล้มเหลว โปรดตรวจสอบรายละเอียดที่แท็บ Actions บน GitHub"
          fi

          COMMIT_MSG="${{ github.event.head_commit.message }}"
          COMMITTER="${{ github.actor }}"
          PLAY_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

          JSON_PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg desc "$DESC" \
            --arg msg "$COMMIT_MSG" \
            --arg user "$COMMITTER" \
            --arg url "$PLAY_URL" \
            --argjson color "$COLOR" \
            '{
              username: "Chrono Spire Deployer",
              embeds: [{
                title: $title,
                description: $desc,
                color: $color,
                fields: [
                  { name: "📝 Commit Note", value: $msg, inline: false },
                  { name: "👤 Updated By", value: $user, inline: true },
                  { name: "🕹️ Play Game Link", value: ("[👉 คลิกที่นี่เพื่อเปิดเล่นเกมบนเบราว์เซอร์](" + $url + ")"), inline: false }
                ],
                footer: { text: "Chrono Spire CI/CD • Auto Build System" }
              }]
            }')

          curl -H "Content-Type: application/json" -d "$JSON_PAYLOAD" "$DISCORD_WEBHOOK"
